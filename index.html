<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RDM Bonus</title>
  <style>
    body { background: #fff; font-family: Arial, sans-serif; margin: 0; }
    .container { max-width: 670px; margin: 0 auto; padding: 24px; }
    h1 { font-size: calc(1.3em - 2pt); text-align: center; margin-bottom: 16px; color: #c2185b; }
    .scroll { overflow-x: auto; margin-bottom: 20px; }
    table { border-collapse: collapse; table-layout: fixed; width: 670px; font-size: calc(0.95rem - 2pt); }
    table.c4 { width: 570px; }
    table.c3 { width: 440px; }
    col.first-column { width: 180px; }
    col.data-column { width: 130px; }
    col.payout-column { width: 100px; }
    th, td { border: 1px solid #666; padding: 5px 8px; text-align: center; }
    th { background: #d9d9d9; }
    th.title { background: #bfbfbf; font-size: 0.95rem; }
    td.name { text-align: left; background: #f2f2f2; font-weight: bold; }
    td.calc { background: #fff; }
    td.in { background: #ffff00; padding: 0; }
    td.in input, td.in select { width: 100%; box-sizing: border-box; border: none; background: transparent; padding: 5px 8px; font-size: 1em; text-align: center; }
    th input.name-input { width: 100%; box-sizing: border-box; border: none; background: transparent; padding: 5px 8px; font-size: 1em; text-align: center; font-weight: bold; }
    th input.name-input:focus { outline: 2px solid #1976d2; outline-offset: -2px; }
    td.in input.name-input { text-align: center; font-weight: bold; }
    td.name-cell { padding: 0; background: #f2f2f2; }
    td.name-cell input { width: 100%; box-sizing: border-box; border: none; background: transparent; padding: 5px 8px; font-size: 1em; text-align: left; font-weight: bold; }
    td.name-cell input:focus { outline: 2px solid #1976d2; outline-offset: -2px; }
    td.in input:focus, td.in select:focus { outline: 2px solid #1976d2; outline-offset: -2px; }
    td.black { background: #000; }
    td.pay { background: #c6e0b4; }
    td.nopay { background: #f8cbad; color: #c00000; }
    td.money { font-weight: bold; }
    td.total { background: #00b050; color: #fff; font-weight: bold; font-size: calc(1.045rem - 2pt); }
    .reset { background: #1976d2; color: #fff; border: none; border-radius: 5px; padding: 10px 18px; font-size: calc(1em - 2pt); cursor: pointer; }
    .reset:hover { background: #0d47a1; }
    .note { font-size: calc(0.85em - 2pt); color: #555; text-align: center; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>RDM Bonus Estimator</h1>
    <div id="app"></div>
    <div style="text-align:center;"><button class="reset" onclick="resetAll()">Reset</button></div>
    <div class="note">Yellow cells are editable. Does not include operational losses.</div>
  </div>

  <script>
    // Company base payouts per metric; each district can earn half of each
    const BASE = { cslb: 1575, gp: 1350, acc: 900, visa: 675 };
    const BONUS_PER_DISTRICT = 500;
    const CERT_BONUS = 1000;
    const METRICS = [
      { key: 'cslb', label: 'CSLB Rank', kind: 'int' },
      { key: 'gp', label: 'GP per HR', kind: 'pct' },
      { key: 'acc', label: 'New Accounts', kind: 'pct' },
      { key: 'visa', label: 'Visa', kind: 'pct' }
    ];
    const DISTRICT_POTENTIAL = METRICS.reduce((s, m) => s + BASE[m.key] / 2, 0);

    const $ = id => document.getElementById(id);
    const field = (id, kind, extra = '') =>
      `<td class="in"><input id="${id}" data-kind="${kind}" inputmode="decimal" ${extra}></td>`;
    const nameField = (id, def) =>
      `<input id="${id}" class="name-input" value="${def}" placeholder="${def}">`;

    function districtTable(n, def) {
      const rows = METRICS.map(m => `<tr><td class="name">${m.label}</td>
        ${field(`d${n}_${m.key}_p`, m.kind)}${field(`d${n}_${m.key}_c`, m.kind)}
        <td class="calc" id="d${n}_${m.key}_m">—</td><td class="calc money" id="d${n}_${m.key}_pay">—</td></tr>`).join('');
      return `<div class="scroll"><table>
        <colgroup><col class="first-column"><col class="data-column" span="3"><col class="payout-column"></colgroup>
        <thead><tr><th colspan="5" class="title" style="padding:0;">${nameField('name' + n, def)}</th></tr>
        <tr><th>Metrics</th><th>Previous Month</th><th>Current Month</th><th>MoM</th><th>Payouts</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`;
    }

    function bonusTable(title, prefix) {
      const rows = [1, 2].map(n => `<tr><td class="name-cell">${nameField(`${prefix}name${n}`, `District ${n + 2}`)}</td>
        ${field(`${prefix}${n}_p`, 'int')}${field(`${prefix}${n}_c`, 'int')}
        <td class="calc money" id="${prefix}${n}_pay">—</td></tr>`).join('');
      return `<div class="scroll"><table class="c4">
        <colgroup><col class="first-column"><col class="data-column" span="3"></colgroup>
        <thead><tr><th colspan="4" class="title">${title}</th></tr>
        <tr><th>District</th><th>Previous Rank</th><th>Current Rank</th><th>Payouts</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`;
    }

    const companyRows = METRICS.map(m => m.key === 'cslb'
      ? `<tr><td class="name">${m.label}</td><td colspan="3" class="black"></td><td class="calc money">${'$' + BASE.cslb.toFixed(2)}</td></tr>`
      : `<tr><td class="name">${m.label}</td>
          ${field(`c_${m.key}_p`, m.kind)}${field(`c_${m.key}_c`, m.kind)}
          <td class="calc" id="c_${m.key}_m">—</td><td class="calc money">${'$' + BASE[m.key].toFixed(2)}</td></tr>`).join('');

    $('app').innerHTML = `
      <div class="scroll"><table>
        <colgroup><col class="first-column"><col class="data-column" span="3"><col class="payout-column"></colgroup>
        <thead><tr><th colspan="5" class="title">Company Performance</th></tr>
        <tr><th>Metrics</th><th>Previous Month</th><th>Current Month</th><th>MoM</th><th>Base Payouts</th></tr></thead>
        <tbody>${companyRows}</tbody></table></div>
      ${districtTable(1, 'District 1')}
      ${districtTable(2, 'District 2')}
      ${bonusTable('Sustained Bonus', 's')}
      ${bonusTable('Graduation Bonus', 'g')}
      <div class="scroll"><table class="c3">
        <colgroup><col class="first-column"><col class="data-column" span="2"></colgroup><tbody><tr>
        <td class="name">Certification Bonus</td>
        <td class="in"><select id="cert" data-kind="select"><option value="no">No</option><option value="yes">Yes</option></select></td>
        <td class="calc money" id="cert_pay">$0</td></tr></tbody></table></div>
      <div class="scroll"><table class="c3">
        <colgroup><col class="first-column"><col class="data-column" span="2"></colgroup>
        <thead><tr><th>RDM Payouts</th><th>Potential</th><th>Payout</th></tr></thead>
        <tbody id="summary"></tbody></table></div>`;

    const money = v => '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const moneyWhole = v => '$' + v.toLocaleString('en-US', { maximumFractionDigits: 0 });
    const pctText = v => Number.isFinite(v) ? v.toFixed(2) + '%' : '—';

    function parse(id) {
      const s = $(id).value.replace(/[$,%\s]/g, '');
      if (s === '') return NaN;
      const n = Number(s);
      return Number.isFinite(n) ? n : NaN;
    }
    const round2 = v => Math.round(v * 100) / 100;

    // Percent metrics change in percentage points; rank improves when the number drops
    const pctMom = (p, c) => (Number.isFinite(p) && Number.isFinite(c)) ? round2(c - p) : NaN;
    const rankMom = (p, c) => (Number.isFinite(p) && Number.isFinite(c)) ? p - c : NaN;

    function compute(get) {
      const companyMom = {};
      METRICS.filter(m => m.key !== 'cslb').forEach(m => {
        companyMom[m.key] = pctMom(get(`c_${m.key}_p`), get(`c_${m.key}_c`));
      });

      const districts = [1, 2].map(n => {
        const metrics = {};
        let total = 0;
        METRICS.forEach(m => {
          const p = get(`d${n}_${m.key}_p`), c = get(`d${n}_${m.key}_c`);
          const mom = m.key === 'cslb' ? rankMom(p, c) : pctMom(p, c);
          // CSLB pays when rank does not get worse; other metrics pay when the district beats the company MoM
          const threshold = m.key === 'cslb' ? 0 : companyMom[m.key];
          const known = Number.isFinite(mom) && Number.isFinite(threshold);
          const pays = known && mom >= threshold;
          const payout = pays ? BASE[m.key] / 2 : 0;
          total += payout;
          metrics[m.key] = { mom, known, pays, payout };
        });
        return { metrics, total };
      });

      const bonus = prefix => [1, 2].map(n => {
        const mom = rankMom(get(`${prefix}${n}_p`), get(`${prefix}${n}_c`));
        return { known: Number.isFinite(mom), payout: mom > 0 ? BONUS_PER_DISTRICT : 0 };
      });
      const sustained = bonus('s');
      const graduation = bonus('g');
      const sum = list => list.reduce((s, b) => s + b.payout, 0);
      const cert = get('cert') === 'yes' ? CERT_BONUS : 0;
      const sustainedTotal = sum(sustained), graduationTotal = sum(graduation);
      const total = districts[0].total + districts[1].total + sustainedTotal + graduationTotal + cert;
      return { companyMom, districts, sustained, graduation, sustainedTotal, graduationTotal, cert, total };
    }

    const readValue = id => id === 'cert' ? $(id).value : parse(id);
    const momText = (m, v) => m.kind === 'int' ? (Number.isFinite(v) ? String(v) : '—') : pctText(v);

    function render() {
      const r = compute(readValue);
      const name = (id, def) => $(id).value.trim() || def;
      const names = [1, 2].map(n => name('name' + n, 'District ' + n));

      METRICS.filter(m => m.key !== 'cslb').forEach(m => {
        $(`c_${m.key}_m`).textContent = pctText(r.companyMom[m.key]);
      });
      r.districts.forEach((d, i) => {
        METRICS.forEach(m => {
          const x = d.metrics[m.key];
          $(`d${i + 1}_${m.key}_m`).textContent = momText(m, x.mom);
          $(`d${i + 1}_${m.key}_m`).className = 'calc ' + (x.known ? (x.pays ? 'pay' : 'nopay') : '');
          $(`d${i + 1}_${m.key}_pay`).textContent = x.known ? money(x.payout) : '—';
        });
      });
      [['s', r.sustained], ['g', r.graduation]].forEach(([prefix, list]) => {
        list.forEach((b, i) => { $(`${prefix}${i + 1}_pay`).textContent = b.known ? moneyWhole(b.payout) : '—'; });
      });
      $('cert_pay').textContent = moneyWhole(r.cert);

      const rows = [
        [names[0], DISTRICT_POTENTIAL, r.districts[0].total, true],
        [names[1], DISTRICT_POTENTIAL, r.districts[1].total, true],
        ['Sustained Bonus', 2 * BONUS_PER_DISTRICT, r.sustainedTotal, false],
        ['Graduation Bonus', 2 * BONUS_PER_DISTRICT, r.graduationTotal, false],
        ['Certification Bonus', CERT_BONUS, r.cert, false]
      ];
      const fmt = (v, cents) => cents ? money(v) : moneyWhole(v);
      $('summary').innerHTML = rows.map(([label, pot, pay, cents]) =>
        `<tr><td class="name"></td><td class="calc">${fmt(pot, cents)}</td><td class="calc money">${fmt(pay, cents)}</td></tr>`).join('')
        + `<tr><td class="name">TOTAL</td><td class="calc money">${money(rows.reduce((s, x) => s + x[1], 0))}</td><td class="total">${money(r.total)}</td></tr>`;
      // Labels are set as text so district names are never parsed as HTML
      [...$('summary').rows].slice(0, rows.length).forEach((row, i) => { row.cells[0].textContent = rows[i][0]; });
    }

    const STORAGE_KEY = 'rdm-bonus-inputs-v2';
    const inputs = document.querySelectorAll('input, select');

    // Storage can be unavailable (private mode, blocked); the calculator still works without it
    function saveInputs() {
      try {
        const data = {};
        inputs.forEach(i => data[i.id] = i.value);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (e) {}
    }

    function loadInputs() {
      try {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        inputs.forEach(i => { if (typeof data[i.id] === 'string') i.value = data[i.id]; });
      } catch (e) {}
    }

    function resetAll() {
      inputs.forEach(i => { i.value = i.tagName === 'SELECT' ? i.options[0].value : i.defaultValue; });
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
      render();
    }

    // Percent inputs show a % sign once entered
    function formatInput(el) {
      if (el.dataset.kind !== 'pct') return;
      const n = parse(el.id);
      if (!Number.isFinite(n)) return;
      el.value = n.toLocaleString('en-US', { maximumFractionDigits: 2, useGrouping: false }) + '%';
    }

    inputs.forEach(i => {
      i.addEventListener('input', () => { saveInputs(); render(); });
      i.addEventListener('change', () => { saveInputs(); render(); });
      i.addEventListener('blur', () => { formatInput(i); saveInputs(); });
      if (i.tagName === 'INPUT') i.addEventListener('focus', () => i.select());
    });
    loadInputs();
    inputs.forEach(formatInput);
    render();
  </script>
</body>
</html>
